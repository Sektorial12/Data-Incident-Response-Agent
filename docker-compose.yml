version: "3.8"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-agent
    env_file: .env
    network_mode: host
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: incident-dashboard
    ports:
      - "8081:80"
    depends_on:
      - agent
    restart: unless-stopped
