# Agent Configuration
llm:
  # Model is auto-detected from environment variables:
  # ANTHROPIC_API_KEY -> claude-3-5-sonnet-20241022
  # OPENAI_API_KEY    -> gpt-4o
  # GOOGLE_API_KEY    -> gemini-flash-lite-latest
  # If none set, falls back to heuristic-only mode
  model: "auto"
  max_tokens: 4096
  temperature: 0.1

lineage:
  max_hops: 3
  direction: "UPSTREAM"

confidence:
  confirmed_threshold: 0.8
  probable_threshold: 0.5
  rejected_below: 0.5

timeout:
  agent_seconds: 30
  mcp_call_seconds: 15
  llm_call_seconds: 20

agents:
  tracer:
    enabled: true
    max_candidates: 5
  checker:
    enabled: true
    parallel: false
  notifier:
    enabled: true
  reporter:
    enabled: true

# Alert routing — route Slack alerts by severity or dataset platform.
# Rules are evaluated top-to-bottom; first match wins.
# If no rule matches, falls back to SLACK_WEBHOOK_URL env var.
alert_routing:
  dedup_window_seconds: 900
  rules:
    - name: "Critical data platform alerts"
      match:
        platform: ["snowflake", "bigquery", "redshift"]
      webhook_url: "${SLACK_CRITICAL_WEBHOOK_URL}"
    - name: "High confidence incidents"
      match:
        min_confidence: 0.8
      webhook_url: "${SLACK_HIGH_PRIORITY_WEBHOOK_URL}"
  default_webhook_url: "${SLACK_WEBHOOK_URL}"
